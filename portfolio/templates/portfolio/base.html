{% load static i18n %}{% get_current_language as LANG %}<!doctype html>
<html lang="{{ LANG }}" data-theme="{{ theme }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Lony Vase · {% translate "Computer science engineering student" %}{% endblock %}</title>
    <meta name="description" content="{% block description %}{% translate "Lony Vase, computer science engineering student at INSA Rennes. Infrastructure and tooling in Python, with a focus on security and AI. Open to internships." %}{% endblock %}">
    <meta name="theme-color" content="#c9a2ff">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="{% static 'portfolio/img/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'portfolio/img/icon-192.png' %}" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="{% static 'portfolio/img/apple-touch-icon.png' %}">
    <link rel="canonical" href="{{ canonical_base }}{{ request.path }}">
    <link rel="alternate" hreflang="en" href="{{ canonical_base }}/">
    <link rel="alternate" hreflang="fr" href="{{ canonical_base }}/fr/">
    <link rel="alternate" hreflang="x-default" href="{{ canonical_base }}/">
    <meta property="og:site_name" content="Lony Vase">
    <meta property="og:title" content="Lony Vase · {% translate "Computer science engineering student" %}">
    <meta property="og:locale" content="{% if LANG == 'fr' %}fr_FR{% else %}en_US{% endif %}">
    <meta property="og:description" content="{% translate "Lony Vase, computer science engineering student at INSA Rennes. Infrastructure and tooling in Python, with a focus on security and AI. Open to internships." %}">
    <meta property="og:image" content="{{ canonical_base }}{% static 'portfolio/img/avatar.jpg' %}">
    <meta property="og:url" content="{{ canonical_base }}{{ request.path }}">
    <meta property="og:type" content="website">
    {% block jsonld %}{% endblock %}
    <link rel="preload" href="{% static 'portfolio/fonts/Satoshi-Variable.ttf' %}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{% static 'portfolio/css/site.css' %}">
    <script src="{% static 'portfolio/js/site.js' %}" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
